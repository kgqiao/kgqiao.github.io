        excerpt: 'We often falsely sever programming from poetry, categorizing one as cold utility and the other as emotional release. But every clean function is a stanza, and every refactored codebase is an edited manuscript.',
        content: `## The Myth of the Dual Brain\\n\\nFor decades, cultural orthodoxy insisted that the human mind is cleft in twain: the left hemisphere dedicated to relentless logic, deterministic mathematics, and binary syntax; the right hemisphere wandering through the ethereal mists of metaphor, color theory, and lyricism.\\n\\nThis taxonomy is not merely inaccurate; it is an insult to the history of craftsmanship.\\n\\nWhen Leonardo sketched hydrodynamic vortices in river eddies, he was executing fluid mechanics with a quill. When Ada Lovelace envisioned the Analytical Engine weaving algebraic patterns “just as the Jacquard loom weaves flowers and leaves,” she did not compartmentalize calculation away from imagination.\\n\\n### Three Axioms for the Hybrid Creator:\\n\\n1. **Elegance is Compression:** A proof with fewer steps, a poem with fewer adjectives, and a subroutine with fewer side effects all share the exact same aesthetic virtue.\\n2. **Constraints Create Form:** The 14 lines of a Petrarchan sonnet, the 60 frames-per-second render loop budget, and the dry-time of linseed oil are all creative guardrails that force ingenuity.\\n3. **Refactoring is Rewriting:** No first draft in prose or first commit in Git is ever sacred. True craft lives exclusively in the ruthless second and third passes.`,

pub unsafe fn cosine_distance_simd(a: &[f32], b: &[f32]) -> f32 {
    let mut dot = _mm512_setzero_ps();
    for i in (0..a.len()).step_by(16) {
        let va = _mm512_loadu_ps(a.as_ptr().add(i));
        let vb = _mm512_loadu_ps(b.as_ptr().add(i));

      render();
    }

    function closeLightbox() {
      activeLightboxArtwork = null;
      render();
    }

    function toggleComposer() {
      isComposerOpen = !isComposerOpen;
      render();
    }

    function handlePublishPost(e) {
      e.preventDefault();
      const title = document.getElementById('post-title-input').value;
      const subtitle = document.getElementById('post-subtitle-input').value;
      const category = document.getElementById('post-cat-input').value;
      const content = document.getElementById('post-content-input').value;

      if (!title || !content) return;

      const words = content.trim().split(/\\s+/).length;
      const readTime = Math.max(1, Math.ceil(words / 200)) + ' min read';

      const newPost = {
        id: 'post-' + Date.now(),
        title: title,
        subtitle: subtitle || 'A studio reflection.',
        date: 'Today',
        readTime: readTime,
        category: category,
        excerpt: content.slice(0, 160) + '...',
        content: content,
        tags: ['Studio Publication'],
        claps: 1
      };

      WRITING_POSTS.unshift(newPost);
      isComposerOpen = false;
      render();
    }

    function applaudPost(id) {
      const p = WRITING_POSTS.find(w => w.id === id);
      if (p) {
        p.claps = (p.claps || 0) + 1;
        render();
      }
    }

    // -------------------------------------------------------------
    // RENDER SYSTEM

      const root = document.getElementById('app-root');

      let html = '';

        html += renderHero();

        html += renderWriterSection();
        html += renderProgrammerSection();
        html += renderContactSection();
        html += '</div>';
      } else if (currentTab === 'artist') {
        html += renderArtistSection();
        html += renderContactSection();
      } else if (currentTab === 'writer') {
        html += renderWriterSection();
        html += renderContactSection();
      } else if (currentTab === 'programmer') {
        html += renderProgrammerSection();
        html += renderContactSection();

      if (activeReaderPost) {
        html += renderReaderModal(activeReaderPost);
      }
      if (activeLightboxArtwork) {
        html += renderLightboxModal(activeLightboxArtwork);
      }
      if (isComposerOpen) {
        html += renderComposerModal();
      }

      root.innerHTML = html;

            <div onclick="setTab('writer')" class="p-6 rounded-2xl bg-neutral-900/60 border border-neutral-800 hover:border-rose-500/40 cursor-pointer transition-all hover:scale-[1.02]">
              <div class="text-rose-400 font-bold font-serif text-lg mb-2">✍️ The Writer</div>
              <p class="text-xs text-neutral-400">Dynamic post gallery with customizable reader typography and live post builder.</p>
              <div class="mt-4 text-xs font-mono text-rose-300 font-semibold">Open Post Gallery →</div>
            </div>
            <div onclick="setTab('programmer')" class="p-6 rounded-2xl bg-neutral-900/60 border border-neutral-800 hover:border-indigo-500/40 cursor-pointer transition-all hover:scale-[1.02]">
              <div class="text-indigo-400 font-bold font-mono text-lg mb-2">💻 The Programmer</div>
              <p class="text-xs text-neutral-400">Software systems and shader engines leading into full case study sub-pages.</p>
              <div class="mt-4 text-xs font-mono text-indigo-300 font-semibold">Explore Case Studies →</div>
            </div>
          </div>
        </section>
      `;
    }

    function renderArtistSection() {
      return `
        <section class="py-8">
          <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-8">
            <div>
              <span class="text-xs font-mono text-amber-400 font-bold uppercase tracking-wider">Discipline I · Visual Arts</span>
              <h2 class="text-3xl font-serif font-bold text-neutral-100 mt-1">Photo Grid Gallery</h2>
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            \${ARTWORKS_DATA.map(a => \`
              <div onclick="openLightbox('\${a.id}')" class="group bg-neutral-900/60 border border-neutral-800 hover:border-amber-500/50 rounded-2xl overflow-hidden cursor-pointer transition-all hover:shadow-xl">
                <div class="aspect-[4/3] overflow-hidden bg-neutral-950 relative">
                  <img src="\${a.imageUrl}" alt="\${a.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                  <div class="absolute inset-0 bg-gradient-to-t from-neutral-950 via-transparent"></div>
                  <div class="absolute bottom-3 left-3 right-3">
                    <span class="text-[10px] font-mono text-amber-400 block">\${a.category} · \${a.year}</span>
                    <h4 class="text-base font-serif font-bold text-neutral-100 truncate">\${a.title}</h4>
                  </div>
                </div>
                <div class="p-4 text-xs text-neutral-400 font-mono flex items-center justify-between border-t border-neutral-800">
                  <span class="truncate max-w-[70%]">\${a.medium}</span>
                  <span class="text-amber-400 font-semibold">Inspect →</span>
                </div>
              </div>
            \`).join('')}
          </div>
        </section>
      `;
    }

    function renderWriterSection() {
      return `
        <section class="py-8">
          <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 mb-8">
            <div>
              <span class="text-xs font-mono text-rose-400 font-bold uppercase tracking-wider">Discipline II · Written Word</span>
              <h2 class="text-3xl font-serif font-bold text-neutral-100 mt-1">Essays & Fiction Post Gallery</h2>
            </div>
            <button onclick="toggleComposer()" class="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold shadow-lg transition-all flex items-center gap-1.5 self-start">
              <span>+ Launch Post Builder</span>
            </button>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            \${WRITING_POSTS.map(w => \`
              <div onclick="openReader('\${w.id}')" class="p-6 bg-neutral-900/60 border border-neutral-800 hover:border-rose-500/50 rounded-2xl cursor-pointer transition-all flex flex-col justify-between hover:shadow-xl">
                <div>
                  <div class="flex items-center justify-between text-xs font-mono text-neutral-500 mb-2">
                    <span class="text-rose-400 font-semibold px-2 py-0.5 rounded bg-rose-500/10 border border-rose-500/20">\${w.category}</span>
                    <span>\${w.readTime}</span>
                  </div>
                  <h3 class="text-xl font-serif font-bold text-neutral-100 mb-2">\${w.title}</h3>
                  <p class="text-xs text-neutral-400 italic mb-4 font-serif">\${w.subtitle}</p>
                  <p class="text-xs text-neutral-300 line-clamp-3 mb-4 leading-relaxed">\${w.excerpt}</p>
                </div>
                <div class="flex items-center justify-between pt-4 border-t border-neutral-800 text-xs text-rose-400 font-semibold">
                  <span onclick="event.stopPropagation(); applaudPost('\${w.id}')" class="text-neutral-400 hover:text-rose-400">♥ \${w.claps || 0} claps</span>
                  <span>Read Article →</span>
                </div>
              </div>
            \`).join('')}
          </div>
        </section>
      `;
    }

    function renderProgrammerSection() {
      return `
        <section class="py-8">
          <div class="mb-8">
            <span class="text-xs font-mono text-indigo-400 font-bold uppercase tracking-wider">Discipline III · Software & Systems</span>
            <h2 class="text-3xl font-mono font-bold text-neutral-100 mt-1">Project Previews (Click to Open Sub-Page)</h2>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            \${PROJECTS_DATA.map(p => \`
              <div onclick="openProjectSubpage('\${p.id}')" class="group bg-neutral-900/60 border border-neutral-800 hover:border-indigo-500/50 rounded-3xl overflow-hidden cursor-pointer transition-all flex flex-col justify-between hover:shadow-2xl">
                <div class="aspect-[16/9] overflow-hidden bg-neutral-950 relative">
                  <img src="\${p.thumbnail}" alt="\${p.title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" />
                  <div class="absolute inset-0 bg-gradient-to-t from-neutral-950 via-neutral-950/20"></div>
                  <div class="absolute top-4 left-4">
                    <span class="px-3 py-1 rounded-xl text-xs font-mono font-semibold bg-neutral-950/80 border border-neutral-700 text-indigo-300">\${p.category}</span>
                  </div>
                  <div class="absolute bottom-4 left-4 right-4">
                    <span class="text-[11px] font-mono text-neutral-400 block mb-1">\${p.year} · \${p.role}</span>
                    <h3 class="text-xl font-mono font-bold text-neutral-100">\${p.title}</h3>
                  </div>
                </div>
                <div class="p-6">
                  <p class="text-xs text-neutral-300 mb-4 line-clamp-2">\${p.tagline}</p>
                  <div class="flex flex-wrap gap-1.5 mb-4">
                    \${p.techStack.map(t => \`<span class="px-2 py-0.5 rounded bg-neutral-950 border border-neutral-800 text-[10px] font-mono text-neutral-400">\${t}</span>\`).join('')}
                  </div>
                  <div class="flex items-center justify-between pt-4 border-t border-neutral-800 text-xs font-mono text-indigo-400 font-semibold">
                    <span>Dedicated Case Study Sub-Page</span>
                    <span>→</span>
                  </div>
                </div>
              </div>
            \`).join('')}
          </div>
        </section>
      `;
    }

    function renderProjectSubpage(p) {
      return `
        <div class="py-6 fade-in">
          <button onclick="closeProjectSubpage()" class="text-xs font-mono text-indigo-400 font-bold mb-6 hover:underline flex items-center gap-1">
            ← Back to All Projects
          </button>
          
          <div class="mb-8">
            <span class="px-3 py-1 rounded-full text-xs font-mono bg-indigo-500/10 text-indigo-300 border border-indigo-500/30 font-bold">
              \${p.category} · \${p.year}
            </span>
            <h1 class="text-3xl sm:text-4xl font-mono font-bold text-neutral-100 mt-3 mb-2">\${p.title}</h1>
            <p class="text-sm text-neutral-300 max-w-3xl leading-relaxed">\${p.tagline}</p>
          </div>

          <div class="aspect-[21/9] rounded-3xl overflow-hidden border border-neutral-800 mb-8 bg-neutral-950">
            <img src="\${p.coverImage}" alt="\${p.title}" class="w-full h-full object-cover" />
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-2 space-y-8">
              <div class="p-6 rounded-2xl bg-neutral-900/60 border border-neutral-800">
                <h3 class="text-sm font-bold font-mono text-indigo-400 uppercase tracking-wider mb-2">Executive Overview</h3>
                <p class="text-xs sm:text-sm text-neutral-200 leading-relaxed">\${p.overview}</p>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="p-5 rounded-2xl bg-red-950/20 border border-red-900/40">
                  <h4 class="text-xs font-bold font-mono text-rose-400 uppercase mb-2">Problem</h4>
                  <p class="text-xs text-neutral-300">\${p.problem}</p>
                </div>
                <div class="p-5 rounded-2xl bg-indigo-950/20 border border-indigo-900/40">
                  <h4 class="text-xs font-bold font-mono text-indigo-400 uppercase mb-2">Solution</h4>
                  <p class="text-xs text-neutral-300">\${p.solution}</p>
                </div>
              </div>

              <div class="p-6 rounded-2xl bg-neutral-900/60 border border-neutral-800">
                <h3 class="text-sm font-bold font-mono text-indigo-400 uppercase tracking-wider mb-3">Architectural System Pipeline</h3>
                <ul class="space-y-2 text-xs text-neutral-300">
                  \${p.architecture.map(a => \`<li class="flex items-start gap-2"><span class="text-indigo-400 font-bold">↳</span><span>\${a}</span></li>\`).join('')}
                </ul>
              </div>

              \${p.codeSnippet ? \`
                <div class="rounded-2xl overflow-hidden border border-neutral-800 bg-neutral-950 font-mono text-xs">
                  <div class="px-4 py-2 bg-neutral-900 border-b border-neutral-800 text-neutral-400 font-bold">Implementation Highlight</div>
                  <pre class="p-4 text-neutral-200 overflow-x-auto"><code>\${p.codeSnippet}</code></pre>
                </div>
              \` : ''}
            </div>

            <div class="space-y-6">
              <div class="p-6 rounded-2xl bg-neutral-900/60 border border-neutral-800">
                <h4 class="text-xs font-mono font-bold uppercase text-neutral-400 mb-3">Applied Tech Stack</h4>
                <div class="flex flex-wrap gap-1.5">
                  \${p.techStack.map(t => \`<span class="px-2.5 py-1 rounded-lg bg-neutral-950 border border-neutral-800 text-[11px] font-mono text-neutral-300">\${t}</span>\`).join('')}
                </div>
              </div>
              <button onclick="closeProjectSubpage()" class="w-full py-3 rounded-xl bg-neutral-900 hover:bg-neutral-800 border border-neutral-700 text-xs font-mono text-neutral-200">
                ← Return to Projects Gallery
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderReaderModal(post) {
      return `
        <div class="fixed inset-0 z-50 bg-neutral-950/95 overflow-y-auto p-6 sm:p-12 fade-in">
          <div class="max-w-3xl mx-auto">
            <button onclick="closeReader()" class="text-xs font-mono text-rose-400 font-bold mb-6 hover:underline">
              ← Close Reader View
            </button>
            <h1 class="text-3xl sm:text-4xl font-serif font-bold text-neutral-100 mb-3">\${post.title}</h1>
            <p class="text-sm font-serif italic text-neutral-400 mb-8">\${post.subtitle}</p>
            <div class="prose text-neutral-200 font-reader text-lg leading-relaxed whitespace-pre-wrap">
              \${post.content}
            </div>
          </div>
        </div>
      `;
    }

    function renderLightboxModal(art) {
      return `
        <div class="fixed inset-0 z-50 bg-neutral-950/95 flex items-center justify-center p-4 sm:p-10 fade-in" onclick="closeLightbox()">
          <div class="max-w-4xl w-full bg-neutral-900 border border-neutral-800 rounded-3xl overflow-hidden p-6" onclick="event.stopPropagation();">
            <div class="flex justify-between items-center mb-4">
              <span class="text-xs font-mono text-amber-400">\${art.category} · \${art.year}</span>
              <button onclick="closeLightbox()" class="text-xs font-mono text-neutral-400 hover:text-white">✕ Close</button>
            </div>
            <img src="\${art.imageUrl}" alt="\${art.title}" class="max-h-[55vh] mx-auto object-contain rounded-xl mb-4" />
            <h3 class="text-2xl font-serif font-bold text-neutral-100">\${art.title}</h3>
            <p class="text-xs font-mono text-neutral-400 mb-2">\${art.medium} — \${art.dimensions}</p>
            <p class="text-xs text-neutral-300 italic">\${art.story}</p>
          </div>
        </div>
      `;
    }

    function renderComposerModal() {
      return `
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-neutral-950/90 backdrop-blur-md fade-in">
          <div class="w-full max-w-2xl bg-neutral-900 border border-neutral-800 rounded-3xl p-6 shadow-2xl">
            <div class="flex items-center justify-between pb-4 mb-4 border-b border-neutral-800">
              <h3 class="text-lg font-bold font-serif text-neutral-100">Dynamic Writing Post Builder</h3>
              <button onclick="toggleComposer()" class="text-neutral-400 hover:text-white text-xs">✕ Close</button>
            </div>
            <form onsubmit="handlePublishPost(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-mono text-neutral-400 mb-1">Post Title *</label>
                <input id="post-title-input" required placeholder="e.g. Symmetries of Code and Light" class="w-full p-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-xs text-neutral-100" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-mono text-neutral-400 mb-1">Subtitle</label>
                  <input id="post-subtitle-input" placeholder="A brief premise..." class="w-full p-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-xs text-neutral-100" />
                </div>
                <div>
                  <label class="block text-xs font-mono text-neutral-400 mb-1">Category</label>
                  <select id="post-cat-input" class="w-full p-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-xs text-neutral-100">
                    <option value="Essays">Essays</option>
                    <option value="Short Fiction">Short Fiction</option>
                    <option value="Technical Articles">Technical Articles</option>
                  </select>
                </div>
              </div>
              <div>
                <label class="block text-xs font-mono text-neutral-400 mb-1">Article Content *</label>
                <textarea id="post-content-input" rows="6" required placeholder="Write your prose here..." class="w-full p-2.5 bg-neutral-950 border border-neutral-800 rounded-xl text-xs text-neutral-100 font-mono"></textarea>
              </div>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold">
                Publish to Gallery
              </button>
            </form>
          </div>
        </div>
      `;
    }

    function renderContactSection() {
      return `
        <section id="contact" class="py-12 border-t border-neutral-900">
          <div class="max-w-2xl mx-auto text-center">
            <h3 class="text-2xl font-serif font-bold text-neutral-100 mb-2">Get in Touch</h3>
            <p class="text-xs text-neutral-400 mb-6">Open for fine art commissions, longform publications, and software architecture projects.</p>
            <div class="p-6 rounded-2xl bg-neutral-900/60 border border-neutral-800 text-xs font-mono text-neutral-300">
              <p>Email: <a href="mailto:alex@studio.mercer" class="text-amber-400 underline">alex@studio.mercer</a></p>
            </div>
          </div>
        </section>
      `;
    }

    // Initialize application
    render();
  </script>
</body>
</html>
